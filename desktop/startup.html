<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legion</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 25% 20%, #243b62, #101726 58%); color: #edf4ff; }
    main { width: min(520px, calc(100vw - 48px)); padding: 42px; border: 1px solid #415779; border-radius: 18px; background: #172239e8; box-shadow: 0 24px 70px #080d1b99; }
    .mark { display: inline-grid; place-items: center; width: 52px; height: 52px; border-radius: 14px; background: #357dff; font-size: 29px; font-weight: 750; }
    h1 { font-size: 26px; margin: 25px 0 8px; }
    p { margin: 0; color: #b9c8dd; line-height: 1.65; }
    #detail { margin-top: 20px; min-height: 45px; font-size: 14px; }
    .bar { margin-top: 20px; height: 5px; border-radius: 8px; overflow: hidden; background: #35445e; }
    .bar::after { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: #64a1ff; animation: move 1.5s infinite alternate ease-in-out; }
    @keyframes move { to { transform: translateX(150%); } }
    .actions { display: flex; gap: 10px; margin-top: 25px; }
    #workspace-path { overflow-wrap: anywhere; margin-top: 14px; }
    #setup p { font-size: 14px; }
    button { border: 0; border-radius: 9px; padding: 11px 19px; background: #357dff; color: white; font: inherit; cursor: pointer; }
    button.secondary { background: #32435f; }
    button:disabled { opacity: .5; cursor: wait; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="mark">L</div>
    <h1 id="heading">正在启动 Legion</h1>
    <p id="description">正在准备工作台和后台服务，请稍候。</p>
    <p id="detail" role="status" aria-live="polite">检查本机环境…</p>
    <div class="bar" id="progress"></div>
    <section id="setup" hidden>
      <p>选择要使用的项目文件夹。设置保存在 Legion 的应用数据目录；任务执行范围会在后续设置中确认。</p>
      <p id="workspace-path">尚未选择文件夹</p>
      <div class="actions">
        <button id="choose-workspace" class="secondary">选择文件夹</button>
        <button id="configure-workspace" disabled>继续设置</button>
      </div>
    </section>
    <div class="actions" id="actions" hidden>
      <button id="retry">重试启动</button>
      <button id="stop" class="secondary">停止服务</button>
    </div>
  </main>
  <script type="module" src="./startup.mjs"></script>
</body>
</html>
