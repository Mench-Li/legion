function renderSide(){if(page==='agents'){

}else{const config={overview:['概览',['空间概览','目标与进展','Agent 团队']],tasks:['任务',['全部任务','我负责的','未分配','待验收']],resources:['资源',['文件与产物','技能','规范']],activity:['动态',['通知','执行动态','上下文快照']],settings:['设置',['空间管理','Agent 配置','模型与连接','浏览器助手']]}[page];
side.innerHTML=`<div class="side-head"><span class="side-title">${config[0]}</span></div><div style="padding:0 20px 15px"><div class="filter">产品空间 <span style="float:right">⌄</span></div></div><div class="side-scroll"><div class="nav-section-title">${page==='tasks'?'任务视图':'工作区'}</div>${config[1].map((n,i)=>`<button class="nav-row ${i===0?'active':''}" data-sub="${n}">${n}<small>${page==='tasks'?[4,1,1,1][i]:''}</small></button>`).join('')}${page==='tasks'?'<div class="nav-section-title">按 Agent</div>'+agents.slice(0,3).map(a=>`<button class="nav-row" data-contact="${a.id}"><span>${a.name}</span><small>进入聊天 ↗</small></button>`).join(''):''}</div><div class="side-foot"><span class="tiny-dot"></span>Legion 协作台</div>`;
side.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{side.querySelectorAll('.nav-row').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(page==='tasks'){activeFilter=b.dataset.sub;renderTasks()}else renderGeneric(b.dataset.sub)});side.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>selectAgent(b.dataset.contact));}}
function renderDirectory(query){const target=document.getElementById('directory');const matches=agents.filter(a=>`${a.name}${a.role}${a.space}`.toLowerCase().includes(query.toLowerCase()));target.innerHTML=['产品空间','市场空间'].map(space=>{const list=matches.filter(a=>a.space===space);if(!list.length)return '';return `<section class="group"><button class="group-toggle" data-group="${space}" aria-expanded="${!collapsed.has(space)}"><span class="chevron">⌄</span>${space}<span class="group-count">${list.length}</span></button><div ${collapsed.has(space)?'hidden':''}>${list.map(a=>`<button class="agent ${a.id===current?'active':''}" data-agent="${a.id}" ${a.id===current?'aria-current="true"':''}>${avatar(a,true)}<div class="agent-info"><div class="agent-name">${a.name}</div><div class="agent-sub ${a.attention?'attention':''}">${a.sub}</div></div>${a.unread?`<span class="badge">${a.unread}</span>`:''}</button>`).join('')}<button class="discussion" data-discussion="${space}">${icon('chat')}空间讨论</button></div></section>`}).join('')||'<div style="padding:25px 12px;color:#8994a1;font-size:12px">没有找到匹配的 Agent</div>';
target.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{collapsed.has(b.dataset.group)?collapsed.delete(b.dataset.group):collapsed.add(b.dataset.group);renderDirectory(query)});target.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>selectAgent(b.dataset.agent));target.querySelectorAll('[data-discussion]').forEach(b=>b.onclick=()=>notify(`${b.dataset.discussion}：空间讨论在此展开既有会话列表`));}
function selectAgent(id){preserveDraft();current=id;page='agents';drawerOpen=false;agents.find(a=>a.id===id).unread=0;render();side.classList.remove('open')}
function message(a,text,user=false,time='10:24'){return `<div class="message ${user?'user':''}">${user?'<div class="avatar blue">林</div>':avatar(a)}<div class="msg-wrap"><div class="msg-meta"><span>${user?'林':a.name}</span><span>${time}</span></div><div class="bubble">${text}</div>${user?'<div class="receipt">已保存 ✓</div>':''}</div></div>`}
function initialMessages(a){if(a.id==='product')return message(a,'帮我梳理一下登录页的需求，优先考虑首次使用的体验。',true,'10:18')+message(a,'我把需求整理为三个部分：账号登录、首次引导和异常提示。<br>建议先完成基础登录流程，再补充首次使用的引导。<div class="task-card"><div class="task-card-head">'+icon('list')+'关联任务 <span class="task-status">待确认</span></div><div class="task-card-main"><div class="task-title">登录页需求与交互方案</div><div class="progress-line">已整理需求范围，等待确认登录方式</div></div><div class="task-card-foot"><button class="text-btn" data-open-task>查看任务 ↗</button><button class="text-btn" data-artifact>需求说明.md ↗</button></div></div>',false,'10:20')+message(a,'先用邮箱和密码登录，暂时不做第三方登录。',true,'10:22')+message(a,'收到。这个范围可以让首版更聚焦。<br>是否需要支持“忘记密码”？确认后我会补充对应交互。<div class="quote">关联任务：登录页需求与交互方案</div>',false,'10:23');return message(a,a.online?`你好，我是${a.name}，负责${a.role}。你可以询问工作进展，或选择任务后补充要求。`:'当前暂不可对话，你仍可以查看之前的聊天和关联任务。',false,'09:40');}
function renderChat(){const a=agents.find(x=>x.id===current);main.innerHTML=`<header class="header"><div class="header-identity"><button class="icon-btn mobile-menu" aria-label="打开 Agent 列表" data-mobile>${icon('menu')}</button>${avatar(a,true)}<div><div class="header-name">${a.name}</div><div class="header-sub"><span style="color:${a.online?'#36a177':'#919ba7'}">${a.online?'可对话':'暂不可对话'}</span><span>·</span><span>${a.space}</span></div></div></div><div class="header-actions"><button class="quiet-btn" id="context-toggle">${icon('panel')}关联任务 <span style="font-size:10px">1</span></button><span class="separator"></span><button class="icon-btn" id="chat-more" aria-label="Agent 资料" title="Agent 资料">${icon('more')}</button></div></header><div class="main-row"><section class="chat-pane"><div class="chat-body" id="chat-body"><div class="chat-content"><div class="date-rule">今天 · 10 月 2 日</div><div class="welcome">与 <strong>${a.name}</strong> 的对话<span style="margin:0 8px;color:#d3d9e1">|</span>${a.role}</div><div id="messages">${initialMessages(a)}${(extra[a.id]||[]).map(m=>message(a,escapeHTML(m.text),m.user,m.time)).join('')}</div></div></div><div class="composer-area"><div class="context-chip">${icon('list').replace('<svg','<svg style="width:12px;height:12px"')}<span id="context-label">询问 · 未关联任务</span><button aria-label="关联任务" id="associate">⌄</button></div><div class="composer"><textarea id="message-input" aria-label="发消息给 ${a.name}" placeholder="${a.online?'发消息给 '+a.name+'…':'当前暂不可对话，可查看历史记录'}" ${a.online?'':'disabled'}></textarea><div class="composer-controls"><div class="composer-left"><button class="icon-btn" id="attach" aria-label="添加附件" title="添加附件">${icon('clip')}</button><input type="file" id="file-input" hidden><span id="attachment-label" style="font-size:10px;color:#8994a1"></span></div><div class="composer-right"><span class="hint">Enter 发送 · Shift + Enter 换行</span><button class="send" id="send" ${a.online?'':'disabled'}>发送 ${icon('send')}</button></div></div></div><div class="footer-label"><span>消息将发送给 ${a.space} / ${a.name}</span><span class="prototype-tag">Legion · Design Preview</span></div></div></section><aside class="drawer" id="drawer" ${drawerOpen?'':'hidden'}>${drawerContent(a)}</aside></div>`;
document.getElementById('message-input').value=drafts[current]||'';document.getElementById('message-input').oninput=e=>drafts[current]=e.target.value;document.getElementById('message-input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}};document.getElementById('send').onclick=sendMessage;document.getElementById('context-toggle').onclick=toggleDrawer;main.querySelectorAll('[data-open-task]').forEach(b=>b.onclick=toggleDrawer);main.querySelectorAll('[data-artifact]').forEach(b=>b.onclick=()=>notify('示例产物：需求说明.md · 已整理登录范围与异常流程'));document.getElementById('chat-more').onclick=()=>notify(`${a.name} · ${a.role} · ${a.space}`);document.getElementById('associate').onclick=()=>{document.getElementById('context-label').textContent='询问 · 登录页需求与交互方案';toggleDrawer(true)};document.getElementById('attach').onclick=()=>document.getElementById('file-input').click();document.getElementById('file-input').onchange=e=>{document.getElementById('attachment-label').textContent=e.target.files[0]?.name||'';notify('附件仅用于本地样式预览，不会上传')};document.getElementById('drawer-close').onclick=()=>toggleDrawer(false);bindMobile();scrollBottom();}
function drawerContent(a){return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:25px"><strong>任务上下文</strong><button class="icon-btn" id="drawer-close" aria-label="关闭任务抽屉">${icon('close')}</button></div><h4>当前关联任务</h4><div class="drawer-card"><span class="project-pill">产品空间</span><div class="task-title" style="margin-top:12px">登录页需求与交互方案</div><p>整理首版登录范围，补充首次使用和异常处理流程。</p><div class="mini-progress"><span></span></div><div class="fact-row"><span>需求整理</span><strong>2 / 3 项已确认</strong></div></div><h4>任务信息</h4><div class="fact-row"><span>负责人</span><strong>${a.name}</strong></div><div class="fact-row"><span>状态</span><strong>等待确认</strong></div><div class="fact-row"><span>最近进展</span><strong>今天 10:23</strong></div><h4>最近产物</h4><div class="file-item">需求说明.md<small>范围、登录方式与异常提示</small></div><div class="file-item">登录流程草图<small>初步交互方案 · 待确认</small></div><h4>待你回答</h4><div class="drawer-card" style="font-size:12px;color:#847157;background:#fcfaf5">首版是否需要支持忘记密码？<div style="display:flex;gap:8px;margin-top:12px"><button class="filter" data-answer="需要支持忘记密码">需要</button><button class="filter" data-answer="首版暂不支持忘记密码">暂不需要</button></div></div>`}
function toggleDrawer(force){drawerOpen=typeof force==='boolean'?force:!drawerOpen;document.getElementById('drawer').hidden=!drawerOpen;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{document.getElementById('message-input').value=b.dataset.answer;document.getElementById('message-input').focus()})}
function scrollBottom(){const body=document.getElementById('chat-body');if(body)body.scrollTop=body.scrollHeight}
function sendMessage(){const input=document.getElementById('message-input'),a=agents.find(x=>x.id===current);if(!a.online||!input.value.trim())return;const text=input.value.trim(),time=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});extra[current]??=[];extra[current].push({text,user:true,time});input.value='';drafts[current]='';document.getElementById('messages').insertAdjacentHTML('beforeend',message(a,escapeHTML(text),true,time));scrollBottom();notify('演示消息已添加到当前会话；此原型未连接 Agent 服务')}
const tasks=[{title:'补充首次使用引导方案',state:0,person:'product',priority:'普通',date:'10月6日'},{title:'整理异常提示与错误文案',state:0,person:'ops',priority:'普通',date:'10月8日'},{title:'实现邮箱登录页面',state:1,person:'dev',priority:'高',date:'10月5日'},{title:'登录页需求与交互方案',state:2,person:'product',priority:'普通',date:'今天'}];
function renderTasks(){let shown=tasks.filter(t=>activeFilter==='全部任务'||activeFilter==='我负责的'&&t.person==='product'||activeFilter==='待验收'&&t.state===2||activeFilter==='未分配'&&false);main.innerHTML=`<div class="board-page"><div class="page-title-row"><div style="display:flex;align-items:center;gap:9px"><button class="icon-btn mobile-menu" data-mobile aria-label="打开导航">${icon('menu')}</button><div><h1>${activeFilter}</h1><p>产品空间 · 让每一项工作都有进展</p></div></div><button class="primary" id="new-task">＋ 新建任务</button></div><div class="toolbar"><div class="tabs">${['看板','列表'].map(t=>`<button data-mode="${t}" class="${taskMode===t?'active':''}">${t}</button>`).join('')}</div><div class="filters"><button class="filter" id="owner-filter">负责人 ⌄</button><button class="filter" id="priority-filter">优先级 ⌄</button><button class="filter" id="project-filter">项目 ⌄</button></div></div>${taskMode==='看板'?`<div class="columns">${['需求池','进行中','待验收'].map((n,i)=>`<section class="column"><div class="column-heading"><span class="tiny-dot" style="background:${['#98a1ad','#008594','#d7a053'][i]}"></span>${n}<span class="number">${shown.filter(t=>t.state===i).length}</span></div>${shown.filter(t=>t.state===i).map(taskCard).join('')}<button class="column-add" data-add="${n}">＋ 添加任务</button></section>`).join('')}</div>`:`<div class="generic-list">${shown.length?shown.map(t=>`<div class="generic-item"><button data-task="${t.person}">${t.title}</button><small>${['需求池','进行中','待验收'][t.state]} · ${agents.find(a=>a.id===t.person).name}</small></div>`).join(''):'暂无任务'}</div>`}<div style="margin-top:20px;color:#a4aeba;font-size:10px">${shown.length} 项任务 · 示例数据</div></div>`;document.getElementById('new-task').onclick=()=>notify('参考原型：此处打开新建任务表单');main.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>notify(`新任务将添加到「${b.dataset.add}」`));main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{taskMode=b.dataset.mode;renderTasks()});main.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>selectAgent(b.dataset.task));['owner','priority','project'].forEach(n=>document.getElementById(n+'-filter').onclick=()=>notify('参考原型：此处展开筛选选项'));bindMobile()}
function taskCard(t){const a=agents.find(x=>x.id===t.person);return `<button class="board-card" data-task="${a.id}" title="进入负责人 ${a.name} 的聊天"><span class="project-pill">登录体验</span><div class="card-title">${t.title}</div><div class="card-meta"><span class="priority" style="background:${t.priority==='高'?'#dc8d6e':'#a5adb9'}"></span>${t.priority}${avatar(a)}<span>${a.name}</span><span class="card-date">${t.date}</span></div></button>`}
function renderGeneric(sub){const configs={overview:{title:'空间概览',desc:'产品空间 · 今天的协作进展',items:[['登录页需求与交互方案','等待确认 · 产品助理'],['实现邮箱登录页面','进行中 · 开发 Agent'],['补充首次使用引导方案','需求池 · 产品助理']]},resources:{title:'资源',desc:'将产物、技能与规范集中在一个入口',items:[['需求说明.md','文件与产物 · 今天 10:20'],['前端开发与验证','技能 · 开发 Agent'],['产品交付规范','规范 · 空间共享']]},activity:{title:'动态',desc:'关注需要你处理的消息与工作变化',items:[['产品助理等待确认：是否支持忘记密码？','待你处理 · 10:23'],['开发 Agent 开始验证邮箱登录页面','执行动态 · 10:21'],['需求说明.md 已生成','产物更新 · 10:20']]},settings:{title:'设置',desc:'管理空间、Agent 与工作工具',items:[['产品空间','3 个 Agent · 本地工作空间'],['市场空间','2 个 Agent · 本地工作空间'],['模型与连接','配置答问与执行能力'],['浏览器助手','工具入口']]}};const c=configs[page];main.innerHTML=`<div class="board-page"><div class="page-title-row"><div><h1>${sub||c.title}</h1><p>${c.desc}</p></div><span class="prototype-tag">Design Preview</span></div>${page==='overview'?'<div class="generic-grid"><div class="summary-card"><small>正在进行</small><strong>1 <span style="font-size:12px;color:#a0aab5">项任务</span></strong></div><div class="summary-card"><small>待你确认</small><strong style="color:#b89054">1</strong></div><div class="summary-card"><small>可对话 Agent</small><strong>4 <span style="font-size:12px;color:#a0aab5">/ 5</span></strong></div></div>':''}<section class="generic-list"><h3>${page==='overview'?'当前工作':sub||c.title}</h3>${c.items.map((item,i)=>`<div class="generic-item"><div>${item[0]}<div><small>${item[1]}</small></div></div><button class="text-btn" data-generic="${i}">${page==='settings'?'管理':'查看'} ↗</button></div>`).join('')}</section></div>`;main.querySelectorAll('[data-generic]').forEach(b=>b.onclick=()=>{if(page==='overview'||page==='activity')selectAgent(+b.dataset.generic===1?'dev':'product');else notify('参考原型：此处进入 '+c.items[+b.dataset.generic][0])})}
function bindMobile(){main.querySelectorAll('[data-mobile]').forEach(b=>b.onclick=()=>side.classList.toggle('open'))}
function render(){document.querySelectorAll('[data-page]').forEach(b=>{const active=b.dataset.page===page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});renderSide();if(page==='agents')renderChat();else if(page==='tasks')renderTasks();else renderGeneric()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{preserveDraft();page=b.dataset.page;activeFilter='全部任务';drawerOpen=false;side.classList.remove('open');render()});render();
</script>
</body>
</html>
