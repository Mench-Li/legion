<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tile: deep dark navy rounded square -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="#0d1220"/>

  <!-- Three connecting arms: quadratic bezier, tucked under hexagon -->
  <g stroke="#e6e9f0" stroke-width="15" stroke-linecap="round" fill="none">
    <!-- top arm -->
    <path d="M 256 234 Q 268 186 256 118"/>
    <!-- lower-right arm -->
    <path d="M 322 296 Q 356 304 374 326"/>
    <!-- lower-left arm -->
    <path d="M 190 296 Q 156 304 138 326"/>
  </g>

  <!-- Central hexagon hub: solid light blue -->
  <polygon points="256,198 306,227 306,285 256,314 206,285 206,227" fill="#93c5fd"/>

  <!-- Three agent nodes -->
  <g fill="#e6e9f0">
    <circle cx="256" cy="118" r="21"/>
    <circle cx="374" cy="326" r="21"/>
    <circle cx="138" cy="326" r="21"/>
  </g>
</svg>
