<section class="section" style="padding-top:44px">

  <p class="sub" style="margin:16px 0 0">
    一个目标拆出的八个阶段任务。点开任一阶段，看它的描述、验收标准、证据与验收记录 ——

</div>

<script type="application/json" id="demo-data">
{

  },

      "evidence": { "kind": "doc", "label": "选型说明", "body": "方案 A：运行时查词典，导出时按 locale 渲染。\n  优：一处维护；缺：导出的产物依赖运行时，CI 里要能跑起来。\n方案 B：导出时预展开成静态串。\n  优：产物自包含；缺：每次加语言要重跑导出。\n选 A。代价是 CI 必须能加载词典 —— 已记入 T-demo-08 的验收。" },

      "evidence": { "kind": "list", "label": "拆解结果", "items": ["T-demo-04 测试用例设计（依赖 T-demo-01）", "T-demo-05 编码实现（依赖 T-demo-04）", "T-demo-06 代码审查（依赖 T-demo-05）", "T-demo-07 测试执行（依赖 T-demo-06 通过）", "T-demo-08 部署与 CI/CD（依赖 T-demo-07 通过）"] },

    },

      "evidence": { "kind": "diff", "label": "实现补丁（节选）", "body": "--- a/src/export/render.mjs\n+++ b/src/export/render.mjs\n@@ -12,6 +12,14 @@ export function render(rows, opts = {}) {\n-  const head = columns.map((c) => c.label)\n+  const locale = resolveLocale(opts.locale)\n+  const head = columns.map((c) => translate(c.label, locale))\n   const body = rows.map((r) => columns.map((c) => format(r[c.key], c, locale)))\n   return [...]\n }\n+\n+// 缺失键回退到 en，并在表头加 * 标注（不静默丢内容）。\n+function translate(key, locale) {\n+  return dict[locale]?.[key] ?? dict.en?.[key] ?? `${key} *`\n+}" },

      "acceptance": ["全部用例执行并留档", "失败项有结论"],

    },
    {

      "acceptance": ["CI 里能加载词典", "导出产物有版本标记"],
      "evidence": { "kind": "pending", "label": "尚未开始", "body": "等待 T-demo-07 通过。" }

</script>

<script>
(function () {
  // ── 主题 ──────────────────────────────────────────────────────────────────
  var tb = document.getElementById('theme-toggle')
  tb.addEventListener('click', function () {
    var dark = document.documentElement.dataset.theme !== 'dark'
    document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    tb.setAttribute('aria-pressed', String(dark))
    tb.setAttribute('aria-label', dark ? '切换为浅色设计' : '切换为深色设计')
    try { localStorage.setItem('legion-theme', dark ? 'dark' : 'light') } catch (e) {}
  })
  if (document.documentElement.dataset.theme === 'dark') {
    tb.setAttribute('aria-pressed', 'true'); tb.setAttribute('aria-label', '切换为浅色设计')
  }

  var data = JSON.parse(document.getElementById('demo-data').textContent)
  var STATUS = { done: ['已完成', 'done'], human: ['待你决定', 'human'], todo: ['待办', ''] }

  /** 造元素的小工具。**一律用 textContent 填数据** —— 演示数据也不走 innerHTML，
      免得"示例"变成一条注入路径。 */
  function el(tag, cls, text) {
    var n = document.createElement(tag)
    if (cls) n.className = cls
    if (text !== undefined && text !== null) n.textContent = text
    return n
  }

  // ── 目标卡 ────────────────────────────────────────────────────────────────
  var g = data.goal
  var goal = document.getElementById('goal')
  goal.appendChild(el('div', 'k', '当前目标'))
  goal.appendChild(el('div', 't', g.title))
  var m = el('div', 'm')
  m.appendChild(el('span', 'mono', g.id))
  m.appendChild(el('span', 'mono', g.progress + ' / ' + g.total + ' 阶段已完成'))
  goal.appendChild(m)
  var bar = el('div', 'bar'); var fill = el('i')
  fill.style.width = Math.round((g.progress / g.total) * 100) + '%'
  bar.appendChild(fill); goal.appendChild(bar)

  // ── 阶段链 ────────────────────────────────────────────────────────────────
  var chain = document.getElementById('chain')
  var panel = document.getElementById('panel')

  function renderPanel(stage) {
    panel.textContent = ''
    var ph = el('div', 'ph')
    ph.appendChild(el('h3', null, stage.name))
    var st = STATUS[stage.status] || ['', '']
    ph.appendChild(el('span', 'pill ' + st[1], st[0]))
    panel.appendChild(ph)
    panel.appendChild(el('div', 'crumb', stage.id + ' · ' + stage.role + ' · ' + stage.roleKey))

    panel.appendChild(el('h4', null, '任务描述'))
    panel.appendChild(el('p', null, stage.desc))

    panel.appendChild(el('h4', null, '验收标准'))
    var ul = el('ul')
    stage.acceptance.forEach(function (a) { ul.appendChild(el('li', null, a)) })
    panel.appendChild(ul)

    var ev = stage.evidence
    panel.appendChild(el('h4', null, '证据 · ' + ev.label))
    if (ev.kind === 'list') {
      var ul2 = el('ul')
      ev.items.forEach(function (i) { ul2.appendChild(el('li', null, i)) })
      panel.appendChild(ul2)
    } else if (ev.kind === 'pending') {
      panel.appendChild(el('p', null, ev.body))
    } else {
      // doc / diff 都按等宽块显示：内容是数据，用 textContent 填。
      panel.appendChild(el('pre', null, ev.body))
    }

    panel.appendChild(el('h4', null, '验收'))
    if (stage.gate) panel.appendChild(el('div', 'gate', stage.gate))
    else if (stage.record) panel.appendChild(el('div', 'rec', stage.record))
    else panel.appendChild(el('p', null, '尚未到验收环节。'))
  }

  var buttons = []
  data.stages.forEach(function (stage, i) {
    var li = el('li')
    var b = el('button', 'demo-step')
    b.type = 'button'
    b.appendChild(el('span', 'n', String(i + 1).padStart(2, '0')))
    var who = el('span')
    who.appendChild(el('span', 'who', stage.role))
    who.appendChild(el('div', 'what', stage.name))
    b.appendChild(who)
    var st = STATUS[stage.status] || ['', '']
    b.appendChild(el('span', 'pill ' + st[1] + ' st', st[0]))
    b.addEventListener('click', function () {
      buttons.forEach(function (x) { x.setAttribute('aria-current', 'false') })
      b.setAttribute('aria-current', 'true')
      renderPanel(stage)
    })
    buttons.push(b)
    li.appendChild(b)
    chain.appendChild(li)
  })

  // 默认打开**人工闸门**那一阶段 —— 演示的重点就是"需要你决定"这件事。
  var idx = Math.max(0, data.stages.findIndex(function (s) { return s.status === 'human' }))
  buttons[idx].setAttribute('aria-current', 'true')
  renderPanel(data.stages[idx])
})()
</script>
</body>
</html>
