<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- 手机端：viewport 必须带 viewport-fit=cover，否则刘海屏两侧留白，
     而消息流的左右边距会被安全区挤掉。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="color-scheme" content="dark light" />
<title>Legion 手机端</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
  --fg: #e6e9ef; --muted: #9aa3b2; --accent: #6ea8fe;
  --ok: #4ade80; --warn: #fbbf24; --error: #f87171;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) {
  :root { --bg:#f6f7f9; --panel:#fff; --panel-2:#f0f2f5; --line:#dfe3e9; --fg:#141821; --muted:#5b6577; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; }
body { display:flex; flex-direction:column; overscroll-behavior-y: contain; }
button { font: inherit; color: inherit; background: var(--panel-2); border:1px solid var(--line);
  border-radius: 10px; padding: 10px 14px; min-height: 44px; }
button:active { opacity:.7; }
button.primary { background: var(--accent); border-color: var(--accent); color:#0b1020; font-weight:600; }
button[disabled] { opacity:.45; }
input, textarea, select { font: inherit; color: inherit; background: var(--panel-2);
  border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%; min-height:44px; }
header { padding: calc(var(--safe-top) + 10px) 14px 10px; background: var(--panel);
  border-bottom:1px solid var(--line); position: sticky; top:0; z-index:5; }
header .row { display:flex; align-items:center; gap:10px; }
header h1 { font-size:17px; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#status { margin-top:8px; font-size:13px; display:flex; gap:8px; align-items:baseline; }
#status .dot { width:8px; height:8px; border-radius:50%; flex:none; margin-top:5px; }
#status .dot.ok{background:var(--ok)} #status .dot.warn{background:var(--warn)}
#status .dot.error{background:var(--error)} #status .dot.busy{background:var(--accent)} #status .dot.muted{background:var(--muted)}
#status .detail { color: var(--muted); }
main { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding: 12px 14px 8px; }
.msg { margin: 0 0 12px; max-width: 88%; }
.msg .meta { font-size:12px; color:var(--muted); margin-bottom:4px; display:flex; gap:8px; align-items:center; }
.msg .body { background: var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 12px;
  white-space: pre-wrap; overflow-wrap: anywhere; }
/* 来源可区分：靠**边框色与标签**，不靠位置。位置是靠不住的——同一条消息
   因为补投顺序可能画在任何地方。 */
.msg[data-source="user"] { margin-left:auto; }
.msg[data-source="user"] .body { background: #1d3a63; border-color:#26497a; color:#eaf1fb; }
.msg[data-source="progress"] .body { border-left:3px solid var(--accent); }
.msg[data-source="command"] .body { border-left:3px solid var(--warn); font-size:15px; }
.msg[data-source="agent"] .body { border-left:3px solid var(--line); }
.tag { font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
.tag.progress{color:var(--accent);border-color:var(--accent)} .tag.command{color:var(--warn);border-color:var(--warn)}
.tag.create_task{color:var(--ok);border-color:var(--ok)}
.taskref { color: var(--accent); text-decoration:none; }
.groups { display:flex; flex-direction:column; gap:8px; }
.group h2 { font-size:13px; color:var(--muted); margin:0 0 6px; font-weight:600;
  display:flex; align-items:baseline; gap:6px; }
.group h2 .n { color:var(--fg); }
.task { background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; margin-bottom:8px; }
.task .t { font-weight:600; overflow-wrap:anywhere; }
.task .s { font-size:12px; color:var(--muted); margin-top:2px; }
.task .m { font-size:12px; color:var(--muted); margin-top:2px; }
.task .acts { display:flex; gap:8px; margin-top:8px; }
.task .acts button { min-height:34px; padding:4px 10px; font-size:13px; }
footer { padding: 8px 14px calc(var(--safe-bottom) + 10px); background: var(--panel); border-top:1px solid var(--line); }
footer .row { display:flex; gap:8px; align-items:flex-end; }
footer textarea { resize:none; max-height:120px; }
#screen-login { padding: 24px 18px; display:flex; flex-direction:column; gap:12px; }
#screen-login h2 { margin:0; font-size:20px; }
.hint { font-size:13px; color:var(--muted); }
.error-box { background:#3a1a1a; border:1px solid #7f2b2b; color:#ffd7d7; padding:10px 12px; border-radius:10px; font-size:14px; }
.notice-box { background:#3a331a; border:1px solid #7f6a2b; color:#ffeec2; padding:10px 12px; border-radius:10px; font-size:14px; }
.hidden { display:none !important; }
#tabs { display:flex; gap:6px; margin-top:8px; }
#tabs button { flex:1; min-height:38px; padding:6px 8px; font-size:14px; position:relative; }
#tabs button[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#0b1020; font-weight:600; }
#tabs button .badge { position:absolute; top:-6px; right:-4px; background:var(--warn); color:#3a2a00;
  border-radius:999px; font-size:11px; font-weight:700; padding:0 6px; line-height:16px; min-width:16px; }
/* 意图选择：三个 chip，选中的那个要一眼看出来——它决定"这句话会不会变成任务"。 */
#intents { display:flex; gap:6px; margin-bottom:8px; }
#intents button { flex:1; min-height:34px; padding:4px 6px; font-size:13px; border-radius:999px; }
#intents button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#0b1020; font-weight:600; }
#intent-hint { font-size:12px; color:var(--muted); margin-bottom:6px; }
#target-row { display:flex; gap:8px; margin-bottom:8px; }
#target-row select { flex:1; min-height:38px; }
.viewtitle { font-size:13px; color:var(--muted); margin:0 0 8px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 id="title">Legion</h1>
    <button id="btn-refresh" title="刷新">刷新</button>
    <button id="btn-logout" title="退出登录">退出</button>
  </div>
  <div id="status"><span class="dot muted"></span><span class="label">连接中…</span><span class="detail"></span></div>
  <div id="tabs" role="tablist">
    <button id="tab-board" role="tab" aria-selected="true">看板</button>
    <button id="tab-chat" role="tab" aria-selected="false">对话</button>
    <button id="tab-account" role="tab" aria-selected="false">我的</button>
  </div>
</header>

<section id="screen-login">
  <h2 id="auth-title">登录 Legion</h2>
  <div class="hint" id="auth-hint">用你的 Legion 账号登录。Hub 地址默认取当前站点。</div>
  <label>用户名<input id="login-name" autocomplete="username" autocapitalize="off" /></label>
  <label>口令<input id="login-password" type="password" autocomplete="current-password" /></label>
  <label id="register-invite-row" class="hidden">邀请码<input id="register-invite" autocapitalize="off" /></label>
  <div class="hint hidden" id="password-hint">口令至少 8 个字符。</div>
  <button class="primary" id="btn-login">登录</button>
  <button id="btn-register" class="hidden">注册新账号</button>
  <div class="hint" id="auth-switch"></div>
  <div class="hint" id="bootstrap-hint" hidden>这台 Hub 还没有初始化：请在服务器上建第一个管理员账号。</div>
  <div id="login-error" class="error-box hidden"></div>
  <div id="login-notice" class="notice-box hidden"></div>
</section>

<main id="main" class="hidden">
  <div id="view-board">
    <p class="viewtitle" id="board-scope"></p>
    <div id="task-groups" class="groups"></div>
  </div>
  <div id="view-chat" class="hidden">
    <div id="timeline"></div>
  </div>
  <div id="view-account" class="hidden">
    <div id="account-who" class="hint"></div>

    <div class="group">
      <h2>改口令</h2>
      <label>当前口令<input id="pw-current" type="password" autocomplete="current-password" /></label>
      <label>新口令<input id="pw-new" type="password" autocomplete="new-password" /></label>
      <div class="hint">至少 8 个字符。改完会把**其它**设备上的登录踢掉，这台保留。</div>
      <div class="acts"><button class="primary" id="btn-change-pw">改口令</button></div>
    </div>

    <div class="group">
      <h2>登录中的设备<span class="n" id="session-count"></span></h2>
      <div id="sessions"></div>
    </div>

    <div class="group hidden" id="invite-group">
      <h2>邀请新成员</h2>
      <div class="hint">这台 Hub 的注册策略是「<span id="reg-mode"></span>」。生成一个邀请码，发给对方注册。</div>
      <div class="row" style="display:flex; gap:8px; align-items:flex-end; margin-top:8px;">
        <select id="invite-role">
          <option value="member">成员</option>
          <option value="admin">管理员</option>
          <option value="viewer">只读</option>
        </select>
        <button class="primary" id="btn-invite">生成邀请码</button>
      </div>
      <div id="invite-out" class="hidden">
        <div class="hint" style="margin-top:8px">把这一串发给对方，它只能用一次：</div>
        <textarea id="invite-code" rows="2" readonly></textarea>
      </div>
    </div>

    <div class="group">
      <h2>关于</h2>
      <div class="hint" id="about-hub"></div>
      <div class="acts"><button id="btn-logout-2">退出登录</button></div>
    </div>
  </div>
</main>

<footer id="composer" class="hidden">
  <div id="intents" role="group" aria-label="消息意图"></div>
  <div id="intent-hint"></div>
  <div id="target-row">
    <select id="agent-select" aria-label="目标 Agent"></select>
    <select id="task-select" class="hidden" aria-label="目标任务"></select>
  </div>
  <div class="row">
    <textarea id="composer-input" rows="1" placeholder="给 Agent 发消息…"></textarea>
    <button class="primary" id="btn-send">发送</button>
  </div>
</footer>

<script type="module" src="./app.mjs"></script>
</body>
</html>
